<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>L'alphabet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card{
            list-style-type:square;
            margin-left:20px;
        }
        #consonnes{
            list-style-image:url("../images/check.png");
            margin-left:20px;
        }
        li{
            margin-bottom:6px;
            color:#444444;
        }
        .footer-link{
            display:inline-block;
            margin-top:15px;
            color:#6b46c1;
            font-weight : bold;
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>Lettres de l'alphabet</h1>
        </div>
    <ol>
        <div class="card">
            <li>Les <strong>voyelles</strong>
                <p>Il y a 6 voyelles</p>
                <ul>
                    <li>a</li>
                    <li>e</li>
                    <li>i</li>
                    <li>o</li>
                    <li>u</li>
                    <li>y</li>
                </ul>
            </li>
        <li>Les <strong>consonnes</strong>:
            Il y a <em>20</em> consonnes
            <ul id="consonnes">
                <li>b, c, d</li>
                <li>f,g,h</li>
                <li>j,k,l,m,n</li>
                <li>p, q, r, s, t</li>
                <li>v,w,x,z</li>
            </ul>
        </li>
    </ol>
        <a href="../index.html">Retour à l'accueil </a>
        </div>
    </div>

</body>
</html>
